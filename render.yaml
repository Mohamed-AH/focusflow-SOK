# Render Blueprint — deploys FocusFlow on the free tier.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: focusflow
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXTAUTH_URL
        # Set this to your Render URL after the first deploy,
        # e.g. https://focusflow.onrender.com
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string in the dashboard
      - key: MONGODB_DB
        value: focusflow
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false # comma-separated list of admin email addresses
